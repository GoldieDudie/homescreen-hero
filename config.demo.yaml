# HomeScreen Hero Demo Configuration
# This configuration is designed for demo deployment with mock data
# All external API connections are mocked

plex:
  base_url: "http://demo-plex-server:32400"  # Mock URL
  token: "${HSH_PLEX_TOKEN}"

  # Define mock libraries
  libraries:
    - name: "Movies"
      enabled: true
    - name: "TV Shows"
      enabled: true
    - name: "Anime"
      enabled: false

# Authentication settings
auth:
  enabled: true
  secret_key: "${HSH_AUTH_SECRET_KEY}"
  password: "${HSH_AUTH_PASSWORD}"  # "demo"
  token_expiry_hours: 24

# Rotation configuration
rotation:
  enabled: true
  interval_hours: 6
  max_collections: 8
  min_gap_rotations: 2

# Trakt integration (mocked)
trakt:
  enabled: true
  client_id: "${HSH_TRAKT_CLIENT_ID}"
  base_url: "https://api.trakt.tv"
  sources:
    - name: "Oscar Winners 2024"
      url: "https://trakt.tv/users/demo/lists/oscar-winners"
      plex_library: "Movies"
    - name: "Studio Ghibli"
      url: "https://trakt.tv/users/demo/lists/ghibli-films"
      plex_library: "Movies"
    - name: "Christmas Movies"
      url: "https://trakt.tv/users/hdlists/lists/christmas-movies"
      plex_library: "Movies"
    - name: "Halloween Movies"
      url: "https://trakt.tv/users/movistapp/lists/halloween-movies"
      plex_library: "Movies"

# MDBList integration (mocked)
mdblist:
  enabled: true
  api_key: "${HSH_MDBLIST_API_KEY}"
  base_url: "https://api.mdblist.com"
  sources:
    - name: "Top Rated Sci-Fi"
      url: "https://mdblist.com/lists/demo/top-scifi"
      plex_library: "Movies"
    - name: "Hidden Gems"
      url: "https://mdblist.com/lists/demo/hidden-gems"
      plex_library: "Movies"

# Collection groups for rotation
groups:
  # Always Active group is first to ensure these collections always get selected
  - name: "Always Active"
    collections:
      - "Recently Requested"
      - "Trending Movies"
      - "Hot on TV"
    min_picks: 3
    max_picks: 3
    enabled: true
    visibility:
      home: true
      shared: true
      recommended: false

  - name: "Award Winners"
    collections:
      - "Oscar Winners 2024"
      - "Best Picture Winners"
      - "Criterion Collection"
    min_picks: 1
    max_picks: 2
    visibility:
      home: true
      shared: false
      recommended: false

  - name: "Action & Adventure"
    collections:
      - "80s Action Classics"
      - "Nolan Collection"
    min_picks: 1
    max_picks: 2
    visibility:
      home: true
      shared: false
      recommended: false

  - name: "Animation"
    collections:
      - "Studio Ghibli Films"
    min_picks: 0
    max_picks: 1
    visibility:
      home: true
      shared: true
      recommended: false

  - name: "Prestige TV"
    collections:
      - "HBO Prestige Dramas"
      - "British Comedy"
    min_picks: 1
    max_picks: 1
    visibility:
      home: true
      shared: false
      recommended: false

  - name: "Comedy"
    collections:
      - "90s Sitcoms"
      - "Modern Comedy Classics"
    min_picks: 1
    max_picks: 1
    visibility:
      home: true
      shared: false
      recommended: false

  - name: "Christmas Collections"
    collections:
      - "Christmas Classics"
      - "Holiday Comedies"
    min_picks: 0
    max_picks: 2
    date_range:
      start: "11-20"
      end: "12-26"
    visibility:
      home: true
      shared: true
      recommended: false

  - name: "Spooky Season"
    collections:
      - "Halloween Favorites"
      - "Classic Horror"
    min_picks: 0
    max_picks: 2
    date_range:
      start: "10-01"
      end: "10-31"
    visibility:
      home: true
      shared: true
      recommended: false

# Tautulli integration (mocked)
tautulli:
  enabled: true
  api_key: "demo-tautulli-key"
  base_url: "http://demo-tautulli:8181"

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
