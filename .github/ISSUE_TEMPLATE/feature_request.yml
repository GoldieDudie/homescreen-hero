name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: What would you like to see?
      description: A clear description of the feature or improvement.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Why do you want this?
      description: What problem does this solve, or what does it make easier? Help us understand the use case.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: If you have an idea for how this could work, describe it here. Totally optional.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Are there other ways to accomplish this today, or alternative approaches you've considered?
